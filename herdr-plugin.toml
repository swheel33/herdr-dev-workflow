id = "wheels.dev-workflow"
name = "Wheels Dev Workflow"
version = "0.0.1"
min_herdr_version = "0.8.0"
description = "Personal Herdr workflows for managed git worktrees and development tools."
platforms = ["macos", "linux"]

[[actions]]
id = "layout-here"
title = "Set up dev layout here"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" layout-here"]

[[actions]]
id = "new-branch"
title = "New personal branch"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane new-branch"]

[[actions]]
id = "open"
title = "Open worktree or origin branch"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane open"]

[[actions]]
id = "open-all"
title = "Open all managed worktrees"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-all"]

[[actions]]
id = "adopt-workspaces"
title = "Adopt current workspaces"
contexts = ["global", "workspace"]
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/lifecycle.py\" adopt"]

[[actions]]
id = "chat-current"
title = "Chat for current project"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane dispatcher-current"]

[[actions]]
id = "chat-picker"
title = "Chat for another project"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane dispatcher-picker"]

[[actions]]
id = "chat-history"
title = "Previous project chats"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane dispatcher-history"]

[[startup]]
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/lifecycle.py\" startup"]

[[startup]]
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/lifecycle.py\" watch-merged"]

[[events]]
on = "workspace.closed"
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/lifecycle.py\" event"]

[[events]]
on = "worktree.removed"
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/lifecycle.py\" event"]

[[actions]]
id = "retry-cleanup"
title = "Retry pending worktree cleanup"
contexts = ["global", "workspace"]
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/lifecycle.py\" retry"]

[[actions]]
id = "show-cleanup-failures"
title = "Show pending worktree cleanup failures"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane cleanup-failures"]

[[actions]]
id = "show-cleanup-log"
title = "Show worktree cleanup log"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane cleanup-log"]

[[actions]]
id = "lazygit"
title = "Open lazygit"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane lazygit"]

[[actions]]
id = "nvim"
title = "Open Neovim"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane nvim"]

[[actions]]
id = "doctor"
title = "Check workflow dependencies"
contexts = ["workspace"]
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane doctor"]

[[panes]]
id = "new-branch"
title = "New personal branch"
placement = "popup"
width = "80%"
height = "60%"
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" new-branch-pane"]

[[panes]]
id = "open"
title = "Open worktree or origin branch"
placement = "popup"
width = "90%"
height = "70%"
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" open-pane-entry"]

[[panes]]
id = "dispatcher-current"
title = "Chat for current project"
placement = "popup"
width = "95%"
height = "90%"
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/dispatcher.py\" chat-current"]

[[panes]]
id = "dispatcher-picker"
title = "Chat for another project"
placement = "popup"
width = "95%"
height = "90%"
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/dispatcher.py\" chat-picker"]

[[panes]]
id = "dispatcher-history"
title = "Previous project chats"
placement = "popup"
width = "95%"
height = "90%"
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/dispatcher.py\" chat-history"]

[[panes]]
id = "cleanup-failures"
title = "Pending worktree cleanup failures"
placement = "popup"
width = "90%"
height = "70%"
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/lifecycle.py\" show-pane"]

[[panes]]
id = "cleanup-log"
title = "Worktree cleanup log"
placement = "popup"
width = "95%"
height = "85%"
command = ["bash", "-lc", "exec python3 \"$HERDR_PLUGIN_ROOT/lifecycle.py\" show-log-pane"]

[[panes]]
id = "lazygit"
title = "lazygit"
placement = "popup"
width = "90%"
height = "90%"
command = ["lazygit"]

[[panes]]
id = "nvim"
title = "Neovim"
placement = "overlay"
command = ["nvim"]

[[panes]]
id = "doctor"
title = "Workflow dependency check"
placement = "popup"
width = "80%"
height = 20
command = ["bash", "-lc", "exec \"$HERDR_PLUGIN_ROOT/dev-workflow.sh\" doctor"]
