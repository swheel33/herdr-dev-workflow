id = "wheels.dev-workflow"
name = "Wheels Dev Workflow"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Agent-driven project chat, implementation worktrees, and safe lifecycle cleanup."
platforms = ["macos", "linux"]

[[actions]]
id = "new-blank-project"
title = "New blank project"
contexts = ["global"]
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" open-pane new-blank-project"]

[[actions]]
id = "chat-current"
title = "Project Chat"
contexts = ["workspace"]
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" chat-current"]

[[actions]]
id = "chat-history"
title = "History"
contexts = ["workspace"]
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" open-pane dispatcher-history"]

[[actions]]
id = "workflow-status"
title = "Workflow Status"
contexts = ["workspace"]
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" open-pane workflow-status"]

[[actions]]
id = "lazygit"
title = "Open lazygit"
contexts = ["workspace"]
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" open-pane lazygit"]

[[actions]]
id = "nvim"
title = "Open Neovim"
contexts = ["workspace"]
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" open-pane nvim"]

[[startup]]
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" startup"]

[[startup]]
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" watch-merged"]

[[events]]
on = "workspace.closed"
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" event"]

[[events]]
on = "worktree.removed"
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" event"]

[[panes]]
id = "new-blank-project"
title = "New blank project"
placement = "popup"
width = "80%"
height = 18
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" blank-project"]

[[panes]]
id = "dispatcher-chat"
title = "Project Chat"
placement = "tab"
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" run-chat"]

[[panes]]
id = "dispatcher-picker"
title = "Select Project"
placement = "popup"
width = "80%"
height = "70%"
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" chat-picker"]

[[panes]]
id = "dispatcher-history"
title = "History"
placement = "popup"
width = "90%"
height = "75%"
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" chat-history"]

[[panes]]
id = "workflow-status"
title = "Workflow Status"
placement = "popup"
width = "90%"
height = "80%"
command = ["bash", "-lc", "exec node \"$HERDR_PLUGIN_ROOT/dist/cli.mjs\" workflow-status"]

[[panes]]
id = "lazygit"
title = "lazygit"
placement = "popup"
width = "90%"
height = "90%"
command = ["lazygit"]

[[panes]]
id = "nvim"
title = "Neovim"
placement = "overlay"
command = ["nvim"]
