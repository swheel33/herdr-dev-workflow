[[keys.command]]
key = "prefix+n"
type = "plugin_action"
command = "wheels.dev-workflow.new-branch"
description = "new personal branch"

[[keys.command]]
key = "prefix+o"
type = "plugin_action"
command = "wheels.dev-workflow.open"
description = "open worktree or origin branch"

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "wheels.dev-workflow.open-all"
description = "open all managed worktrees"

[[keys.command]]
key = "prefix+space"
type = "plugin_action"
command = "wheels.dev-workflow.chat-current"
description = "chat for current project"

[[keys.command]]
key = "prefix+shift+space"
type = "plugin_action"
command = "wheels.dev-workflow.chat-picker"
description = "chat for another project"

[[keys.command]]
key = "prefix+c"
type = "plugin_action"
command = "wheels.dev-workflow.chat-history"
description = "chats"

[[keys.command]]
key = "prefix+p"
type = "plugin_action"
command = "wheels.dev-workflow.retry-cleanup"
description = "retry pending worktree cleanup"

[[keys.command]]
key = "prefix+shift+p"
type = "plugin_action"
command = "wheels.dev-workflow.show-cleanup-failures"
description = "show pending worktree cleanup failures"

[[keys.command]]
key = "prefix+g"
type = "plugin_action"
command = "wheels.dev-workflow.lazygit"
description = "lazygit"

[[keys.command]]
key = "prefix+e"
type = "plugin_action"
command = "wheels.dev-workflow.nvim"
description = "nvim"

[ui]
agent_panel_sort = "spaces"

[ui.sidebar.agents]
row_gap = 0
rows = []

[ui.sidebar.spaces]
row_gap = 0
